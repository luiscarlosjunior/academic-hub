<!DOCTYPE html>
<html lang="pt-BR" data-root="../../">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design System em AWS · AcademicHub</title>
<meta name="description" content="Disciplina de Design System em AWS: tokens, componentes acessíveis, hospedagem em S3 e CloudFront, CodeArtifact, CI/CD com OIDC, CDK e preparação para certificações AWS, com animações e referências.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/hub.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
</head>
<body class="min-h-full flex flex-col" data-disciplina="dsa">

<header id="ah-header" class="bg-slate-800/80 backdrop-blur border-b border-slate-700/80 sticky top-0 z-50"></header>

<main class="flex-1">
  <section class="ah-grid-bg border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12" id="ah-disc-hero"></div>
  </section>

  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="flex flex-col gap-4 mb-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <h2 class="ah-h2">Trilha da disciplina</h2>
        <div class="relative w-full sm:w-72">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
          <input id="ah-busca" type="search" placeholder="Buscar tópico, termo ou tema…" aria-label="Buscar tópicos"
                 class="ah-input">
        </div>
      </div>
      <div class="flex flex-wrap gap-2 max-w-full" id="ah-trilhas"></div>
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <p class="text-xs text-slate-500" id="ah-contagem"></p>
      </div>
      <div class="flex flex-wrap items-center gap-2 text-xs max-w-full" id="ah-filtros"></div>
    </div>
    <div id="ah-topicos" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
  </section>

  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-14">
    <div class="ah-card p-6">
      <h2 class="ah-h3 mb-3"><i class="fa-solid fa-toolbox text-orange-400 mr-2"></i>Ferramentas recomendadas</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <a href="https://storybook.js.org/docs" target="_blank" rel="noopener" class="ah-card ah-card-hover p-4 flex items-center gap-3">
          <i class="fa-solid fa-book-open text-orange-400 text-xl"></i>
          <div><div class="text-sm font-semibold text-white">Storybook</div>
          <div class="text-xs text-slate-400">Catálogo de componentes isolados, com documentação e testes de interação</div></div>
        </a>
        <a href="https://docs.aws.amazon.com/cdk/v2/guide/home.html" target="_blank" rel="noopener" class="ah-card ah-card-hover p-4 flex items-center gap-3">
          <i class="fa-brands fa-aws text-orange-400 text-xl"></i>
          <div><div class="text-sm font-semibold text-white">Guia do AWS CDK</div>
          <div class="text-xs text-slate-400">Documentação oficial da infraestrutura como código usada na aula</div></div>
        </a>
        <a href="https://www.w3.org/TR/WCAG22/" target="_blank" rel="noopener" class="ah-card ah-card-hover p-4 flex items-center gap-3">
          <i class="fa-solid fa-universal-access text-orange-400 text-xl"></i>
          <div><div class="text-sm font-semibold text-white">WCAG 2.2 (W3C)</div>
          <div class="text-xs text-slate-400">Critérios de acessibilidade que todo componente do sistema deve cumprir</div></div>
        </a>
      </div>
    </div>
  </section>
</main>

<footer id="ah-footer" class="border-t border-slate-800 bg-slate-900/60"></footer>

<script src="../../assets/js/data.js"></script>
<script src="../../assets/js/hub.js"></script>
<script src="../../assets/js/disciplina.js"></script>
</body>
</html>
